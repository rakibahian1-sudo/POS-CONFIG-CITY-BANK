<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal Config Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wider">POS TERMINAL CONFIG GENERATOR</h1>
                <p class="text-xs text-slate-400">Parse Excel data into HDT, TCT & parameter batch configs per TID</p>
            </div>
            <div class="flex gap-2">
                <button onclick="loadDemoData()" class="bg-amber-600 hover:bg-amber-500 text-xs font-semibold px-3 py-2 rounded transition">Load Demo Data</button>
                <button onclick="resetAll()" class="bg-slate-800 hover:bg-slate-700 text-xs font-semibold px-3 py-2 rounded transition">Reset All</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Left Panel: Upload & Column Mapping -->
        <div class="space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <h2 class="text-sm font-semibold text-slate-300 mb-3">1. EXCEL FILE IMPORT</h2>
                <div class="border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-lg p-6 text-center cursor-pointer relative">
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileUpload(event)">
                    <p id="fileStatus" class="text-sm text-slate-400">Drag & drop your Excel sheet here or click to browse</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-4">
                <h2 class="text-sm font-semibold text-slate-300">3. COLUMN MAPPING</h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">TID Column *</label>
                    <select id="tidCol" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm" onchange="updateTable()"></select>
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">MID Column *</label>
                    <select id="midCol" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm" onchange="updateTable()"></select>
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">DBA Name Column *</label>
                    <select id="dbaCol" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm" onchange="updateTable()"></select>
                </div>
            </div>
        </div>

        <!-- Right Panel: Data Table & Output -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div class="flex justify-between items-center mb-4">
                    <span id="rowCount" class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Data Table (0)</span>
                    <button onclick="generateConfigs()" class="bg-blue-600 hover:bg-blue-500 text-xs font-semibold px-4 py-2 rounded transition">Generate Config Files</button>
                </div>
                <div class="overflow-x-auto max-h-96 border border-slate-800 rounded">
                    <table id="dataTable" class="w-full text-left text-xs">
                        <thead class="bg-slate-800 text-slate-300 sticky top-0">
                            <tr><th class="p-2">#</th><th class="p-2">TID</th><th class="p-2">MID</th><th class="p-2">DBA Name</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800 text-slate-400">
                            <tr><td colspan="4" class="p-4 text-center">No data loaded.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let rawData = [];

        function loadDemoData() {
            rawData = [
                { TID: "20002421", MID: "123456789012345", DBA: "Demo Merchant 1" },
                { TID: "20002422", MID: "123456789012346", DBA: "Demo Merchant 2" }
            ];
            populateColumns(["TID", "MID", "DBA"]);
            updateTable();
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('fileStatus').innerText = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                if(json.length > 0) {
                    const headers = json[0];
                    rawData = json.slice(1).map(row => {
                        let obj = {};
                        headers.forEach((h, i) => obj[h] = row[i]);
                        return obj;
                    }).filter(row => Object.keys(row).length > 0);
                    populateColumns(headers);
                    updateTable();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function populateColumns(headers) {
            ['tidCol', 'midCol', 'dbaCol'].forEach(id => {
                const select = document.getElementById(id);
                select.innerHTML = '<option value="">-- Select --</option>';
                headers.forEach(h => {
                    if(h) select.innerHTML += `<option value="${h}">${h}</option>`;
                });
            });
            if(headers.includes('TID')) document.getElementById('tidCol').value = 'TID';
            if(headers.includes('MID')) document.getElementById('midCol').value = 'MID';
            if(headers.includes('DBA')) document.getElementById('dbaCol').value = 'DBA';
        }

        function updateTable() {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';
            const tCol = document.getElementById('tidCol').value;
            const mCol = document.getElementById('midCol').value;
            const dCol = document.getElementById('dbaCol').value;

            document.getElementById('rowCount').innerText = `Data Table (${rawData.length})`;

            rawData.forEach((row, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2">${index + 1}</td>
                        <td class="p-2">${tCol ? (row[tCol] || '') : ''}</td>
                        <td class="p-2">${mCol ? (row[mCol] || '') : ''}</td>
                        <td class="p-2">${dCol ? (row[dCol] || '') : ''}</td>
                    </tr>
                `;
            });
        }

        function resetAll() {
            rawData = [];
            document.getElementById('fileStatus').innerText = "Drag & drop your Excel sheet here or click to browse";
            ['tidCol', 'midCol', 'dbaCol'].forEach(id => document.getElementById(id).innerHTML = '');
            updateTable();
        }

        function generateConfigs() {
            alert("Configuration generation logic can be expanded here based on TID parameters!");
        }
    </script>
</body>
</html>
